services:
    laravel.test:
        build:
            context: './docker'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                MYSQL_CLIENT: mariadb-client
        image: 'minizo-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'

            # ---------------------------------------------------------------
            # vendor/ and node_modules/ deliberately do NOT come from the host.
            # ---------------------------------------------------------------
            #
            # This is the single biggest performance lever for local development,
            # and the numbers are worth recording. On a Windows host every file
            # stat inside a bind mount crosses the Docker VM boundary at ~1.4ms.
            # A Laravel request stats 720 files, of which 690 are in vendor/ —
            # measured at 899ms of the 927ms a cold request spent on filesystem
            # metadata alone. Named volumes live on the VM's own ext4, where the
            # same stat costs ~0.03ms.
            #
            # Child mounts override the parent, so these two shadow the matching
            # subdirectories of '.:/var/www/html' above.
            #
            # Two things follow from this, both intentional:
            #
            #  1. A fresh volume is EMPTY. start-container runs composer install
            #     and npm install on first boot to seed them, the same way it
            #     generates APP_KEY and runs migrations.
            #  2. The host's own vendor/ is no longer what the container uses. It
            #     stays on disk for IDE autocompletion, but can drift after a
            #     `composer require` run inside the container — re-run composer
            #     install on the host if your editor starts disagreeing.
            #
            # If you move this project onto the WSL2 filesystem, none of this is
            # necessary: the boundary cost is what makes it worth having.
            - 'minizo-vendor:/var/www/html/vendor'
            - 'minizo-node-modules:/var/www/html/node_modules'

            # - '/home/rakma/Music:/var/www/html/storage/app/private/music:rw'
            - 'C:\Users\rakma\Music:/var/www/html/storage/app/private/music:rw'
        networks:
            - sail
        depends_on:
            mariadb:
                condition: service_healthy
    mariadb:
        image: 'mariadb:11'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'sail-mariadb:/var/lib/mysql'
            # Sail's create-testing-database.sh is deliberately NOT mounted here.
            #
            # It made this service depend on a file inside the host's vendor/ — which
            # is fragile now that the app container gets vendor/ from a volume: a
            # missing host vendor/ would make Docker create a DIRECTORY at that path
            # and MariaDB's init would choke on it. The database it created was unused
            # anyway; the test suite runs on sqlite :memory: (see phpunit.xml).
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - '--connect'
                - '--innodb_initialized'
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mariadb:
        driver: local

    # See the comment on the laravel.test volumes above for why these exist.
    minizo-vendor:
        driver: local
    minizo-node-modules:
        driver: local
