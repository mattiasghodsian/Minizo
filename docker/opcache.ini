[opcache]
; The web server is `artisan serve`, which runs under the CLI SAPI. opcache.enable
; alone does nothing there - enable_cli is what actually turns the cache on for
; served requests, and its default is 0. Without this line the extension is
; installed and inert, and every request recompiles every file it touches.
opcache.enable=1
opcache.enable_cli=1

; Application files are baked into the image and never change at runtime, so there
; is nothing to revalidate. Set this to 1 if you ever bind-mount source over the
; image, or edits will appear to have no effect.
opcache.validate_timestamps=0

; Laravel plus Flux and Livewire is a large file set. 192M leaves headroom; check
; opcache_get_status()['memory_usage']['free_memory'] if you change the stack.
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Nothing reads the comments at runtime, but stripping them breaks any library
; that reflects on annotations. Keeping them is the safe default.
opcache.save_comments=1
